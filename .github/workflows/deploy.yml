name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate secrets
        run: |
          [ -n "${{ secrets.SSH_HOST }}" ] || { echo 'SSH_HOST empty'; exit 1; }
          [ -n "${{ secrets.SSH_USER }}" ] || { echo 'SSH_USER empty'; exit 1; }
          [ -n "${{ secrets.SSH_KEY }}" ] || { echo 'SSH_KEY empty'; exit 1; }
      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 10 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || { echo 'ssh-keyscan failed'; cat ~/.ssh/known_hosts; exit 1; }
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ secrets.SSH_REMOTE_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
      - name: Stage blog-terminal content
        run: |
          mkdir -p terminal-stamp
          echo "${{ github.sha }}" > terminal-stamp/deployed
      - name: Deploy blog-terminal content
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: src/content/posts/
          remote_path: /srv/blog-terminal/posts/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
      # Written last: a systemd path unit restarts the reader when it changes.
      - name: Signal blog-terminal reload
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avz
          path: terminal-stamp/deployed
          remote_path: /srv/blog-terminal/deployed
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
