# Minimal HTTP-only *example* for initial Certbot bootstrap (2025-11-07T18:57:56.236Z).
# This is not the current production configuration and is not deployed automatically.
# Run: sudo certbot --nginx -d blog.konakona.dev
# konakona.dev is served by the separate profile site (samuelhe52/profile), not this one.
# Certbot will inject SSL directives; then you can add security headers.

server {
  listen 80;
  listen [::]:80;
  server_name blog.konakona.dev;
  root /var/www/blog/dist;
  index index.html;
  # Static file / SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
