# Mirror of the production config on serJP: /etc/nginx/sites-available/blog.konakona52.com.conf
# (enabled via sites-enabled). Synced 2026-10-08; not deployed automatically, so edit the server
# copy (back it up first, run nginx -t, then reload) and update this file to match.
# The Content-Security-Policy here governs what the site and the slide decks may load.

server {
    listen 80;
    listen [::]:80;
    server_name blog.konakona.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.konakona.dev;

    root /var/www/blog/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com;" always;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.konakona52.com konakona52.com;
    return 301 https://blog.konakona.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.konakona52.com konakona52.com;
    ssl_certificate /etc/letsencrypt/live/konakona-dev-dual/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konakona-dev-dual/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://blog.konakona.dev$request_uri;
}
